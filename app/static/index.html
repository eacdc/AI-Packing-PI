<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Inspector</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <span id="station" class="station"></span>
  <span id="mode" class="badge hidden"></span>
  <span id="rec" class="badge rec hidden" title="Trial recording: every photo is saved">● REC</span>
  <span id="job" class="job"></span>
  <span id="clock" class="clock"></span>
  <span id="conn" class="dot" title="Connection"></span>
</header>

<main>
  <section class="left">
    <div id="status" class="status idle">
      <div id="status-title" class="status-title">No lot running</div>
      <div id="status-msg" class="status-msg"></div>
    </div>
    <div class="counters">
      <div><b id="ok">0</b><span>Good</span></div>
      <div class="bad"><b id="alerts">0</b><span>Alerts</span></div>
      <div><b id="rate">0</b><span>Books / hr</span></div>
    </div>
    <button id="btn-ack" class="big danger hidden">OK, checked</button>
    <div class="buttons">
      <button id="btn-start" class="primary">Start lot</button>
      <button id="btn-stop">Stop lot</button>
      <button id="btn-reteach">Re-teach</button>
      <button id="btn-settings">Settings</button>
      <button id="btn-history">History</button>
    </div>
  </section>

  <section class="right">
    <figure>
      <img id="img-last" alt="">
      <figcaption><span id="cap-last">Last book</span><span id="cap-detail" class="detail"></span></figcaption>
    </figure>
    <figure>
      <img id="img-ref" alt="">
      <figcaption>Reference</figcaption>
    </figure>
  </section>
</main>

<!-- Start lot -->
<div id="dlg-start" class="dialog hidden">
  <div class="dialog-box">
    <div class="dialog-head"><h2>Start lot</h2><button class="close" data-close>&times;</button></div>
    <div class="start-grid">
      <div class="start-left">
        <div class="seg">
          <button data-mode="page" class="on">Without cover</button>
          <button data-mode="cover">With cover</button>
        </div>
        <div class="search-row">
          <div id="query" class="query">Type job no.</div>
        </div>
        <div class="keypad">
          <button>1</button><button>2</button><button>3</button>
          <button>4</button><button>5</button><button>6</button>
          <button>7</button><button>8</button><button>9</button>
          <button data-key="del">&#9003;</button><button>0</button><button data-key="search" class="primary">Find</button>
        </div>
      </div>
      <div class="start-right">
        <div id="job-hint" class="hint">Recent jobs</div>
        <ul id="job-list" class="job-list"></ul>
      </div>
    </div>
    <div class="dialog-foot">
      <label class="check"><input type="checkbox" id="chk-reteach"> Re-teach this title</label>
      <button id="btn-manual" class="hidden">Use typed number</button>
      <button id="btn-go" class="primary" disabled>Start</button>
    </div>
  </div>
</div>

<!-- Settings -->
<div id="dlg-settings" class="dialog hidden">
  <div class="dialog-box">
    <div class="dialog-head"><h2>Settings</h2><button class="close" data-close>&times;</button></div>
    <div id="settings-rows" class="settings-rows"></div>
    <div class="dialog-foot">
      <span id="photo-info" class="hint"></span>
      <button id="btn-test">Take test photo</button>
      <button id="btn-save" class="primary">Save</button>
    </div>
  </div>
</div>

<!-- History -->
<div id="dlg-history" class="dialog hidden">
  <div class="dialog-box">
    <div class="dialog-head"><h2 id="history-title">History</h2><button class="close" data-close>&times;</button></div>
    <div id="history-body" class="history-body"></div>
  </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
